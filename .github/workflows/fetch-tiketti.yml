name: Fetch Tiketti Events

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Tiketti and save to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node --input-type=module << 'SCRIPT'
          const res = await fetch('https://www.tiketti.fi/feed/429843696', {
            headers: {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Accept': 'application/xml, text/xml',
            }
          });
          if (!res.ok) { console.error('Tiketti status:', res.status); process.exit(1); }
          const xml = await res.text();
          console.log('Feed haettu, koko:', xml.length, 'merkkiä');

          const today = new Date().toISOString().split('T')[0];
          const itemRe = /<item>([\s\S]*?)<\/item>/g;
          const grouped = new Map();
          let m;
          while ((m = itemRe.exec(xml)) !== null) {
            const item = m[1];
            const get = (tag) => {
              const x = item.match(new RegExp('<' + tag + '[^>]*><!\\[CDATA\\[([\\s\\S]*?)\\]\\]><\\/' + tag + '>|<' + tag + '[^>]*>([\\s\\S]*?)<\\/' + tag + '>'));
              return x ? (x[1] || x[2] || '').trim() : '';
            };
            const title = get('title');
            const short_name = get('short_name') || title;
            const startdate = get('startdate') || get('pubDate');
            if (!title || !startdate) continue;
            const date = startdate.includes('T') ? startdate.split('T')[0] : startdate.split(' ')[0];
            if (date < today) continue;
            const rawCat = get('categories').toLowerCase();
            let category = 'Kulttuuri', subcategory = 'Kulttuuri';
            if (rawCat.includes('musiikki')) { category = 'Musiikki'; subcategory = 'Musiikki'; }
            else if (rawCat.includes('urheilu')) { category = 'Urheilu'; subcategory = 'Urheilu'; }
            else if (rawCat.includes('lapset') || rawCat.includes('perhe')) { category = 'Lapset'; subcategory = 'Lapset'; }
            const key = short_name.substring(0, 60) + '_' + date;
            if (!grouped.has(key)) {
              grouped.set(key, {
                title: short_name.substring(0, 255),
                description: 'Tiketti: ' + short_name,
                city: get('city') || 'Helsinki',
                venue: get('venue').substring(0, 255),
                address: '',
                category, subcategory,
                start_date: date,
                start_time: startdate.includes('T') ? startdate.split('T')[1]?.slice(0, 5) : null,
                end_date: null, end_time: null,
                price: get('price').substring(0, 100),
                ticket_url: get('link').substring(0, 500),
                event_url: get('link').substring(0, 500),
                image_url: get('image').substring(0, 500),
                source: 'tiketti',
                source_id: 'tiketti-' + key.replace(/[^a-z0-9]/gi, '-').substring(0, 80),
                status: 'auto_approved',
              });
            }
          }
          const events = [...grouped.values()];
          console.log('Tapahtumia:', events.length);
          if (events.length === 0) { console.log('Ei tapahtumia, lopetetaan'); process.exit(0); }

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_SERVICE_KEY = process.env.SUPABASE_SERVICE_KEY;

          // Poistetaan vanhat Tiketti-tapahtumat
          const delRes = await fetch(SUPABASE_URL + '/rest/v1/events?source=eq.tiketti', {
            method: 'DELETE',
            headers: {
              'apikey': SUPABASE_SERVICE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY,
            }
          });
          console.log('Vanhat poistettu, status:', delRes.status);

          // Tallennetaan uudet erissä
          for (let i = 0; i < events.length; i += 50) {
            const batch = events.slice(i, i + 50);
            const upsRes = await fetch(SUPABASE_URL + '/rest/v1/events', {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_SERVICE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'resolution=merge-duplicates',
              },
              body: JSON.stringify(batch),
            });
            if (!upsRes.ok) {
              const err = await upsRes.text();
              console.error('Upsert virhe:', err);
            } else {
              console.log('Erä', Math.floor(i/50)+1, 'tallennettu');
            }
          }
          console.log('Valmis! Tallennettu:', events.length, 'tapahtumaa');
          SCRIPT
