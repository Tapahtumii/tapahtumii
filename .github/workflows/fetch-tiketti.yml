name: Fetch Tiketti Events

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Tiketti and save to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cat > /tmp/tiketti.mjs << 'JSEOF'
          const res = await fetch('https://www.tiketti.fi/feed/429843696', {
            headers: { 'User-Agent': 'Mozilla/5.0', 'Accept': 'application/xml' }
          });
          if (!res.ok) { console.error('status:', res.status); process.exit(1); }
          const xml = await res.text();
          console.log('Koko:', xml.length);

          const today = new Date().toISOString().split('T')[0];
          const eventRe = /<event>([\s\S]*?)<\/event>/g;
          const grouped = new Map();
          let skipped = 0;
          let m;

          // Tunnettuja keikkapaikkoja - jos nimi tai paikka sisältää näitä, on keikka
          const KEIKKAPAIKAT = /tavastia|semifinal|g.?livelab|korjaamo|ääniwalli|aaniwalli|nosturi|tavara.?asema|on.?the.?rocks|kulttuuritalo|logomo|telakka|turun.?konserttitalo|pakkahuone|klubi.?tampere|ratinan.?stadion|olympiastadion|hartwall|45.?special|bar.?ihku|rio.?live|riolive|teerenpeli|lutakko|tullikamari|olympia.tampere|z-one|henry.?s.?pub|rytmikorjaamo|klubi\b|semifinali|kuudes.?linja|bar.?loose|botta\b|teatteri.?botta|studio51|juhlatila|konserttisali|musiikkitalo|finlandia.?talo|kulttuurisali|kulttuurikeskus|kaapelitehdas|kino.?laika|house.?of.?rock|kerubi\b|pakkahuone/i;

          while ((m = eventRe.exec(xml)) !== null) {
            const ev = m[1];
            const get = (tag) => { const x = ev.match(new RegExp('<' + tag + '>([\\s\\S]*?)<\\/' + tag + '>')); return x ? x[1].trim() : ''; };

            const name = get('name');
            const short_name = get('short_name') || name;
            const startdate = get('startdate');
            const enddate = get('enddate') || '';
            const location = get('location_name').toLowerCase();

            if (!name || !startdate) continue;
            const date = startdate.split(' ')[0];
            if (date < today) continue;

            // Suodatetaan pois ei-toivotut
            const nameLower = name.toLowerCase();
            if (/kausikortti|kausiliput|season.?pass|season.?ticket/.test(nameLower)) { skipped++; continue; }
            if (/\bvip\b.*(lippu|paketti|lounge|alue|ticket|lisä)|lippu.*\bvip\b/.test(nameLower)) { skipped++; continue; }
            if (/lahjakortti|gift.?card|gift.?voucher/.test(nameLower)) { skipped++; continue; }
            if (/juomatarjoilu|juomapaketti|drink.?package|juomakupong/.test(nameLower)) { skipped++; continue; }
            if (/parkki|pysäköinti|parking/.test(nameLower)) { skipped++; continue; }
            if (/yrityskummi|yritys.*paketti|yritys.*lippu|corporate/.test(nameLower)) { skipped++; continue; }
            if (/lisävaruste|merchandise|fanituote/.test(nameLower)) { skipped++; continue; }
            if (/illallinen|dinner|aamiainen|lounas|brunssi|viinidinner|ruokailupaketti/.test(nameLower)) { skipped++; continue; }

            // Suodatetaan pois yli 400 päivän tapahtumat (kausikortit)
            if (enddate) {
              const diffDays = (new Date(enddate.split(' ')[0]) - new Date(date)) / (1000 * 60 * 60 * 24);
              if (diffDays > 400) { skipped++; continue; }
            }

            // Kategoriointi — järjestys on tärkeä: tarkemmat ensin
            const t = nameLower + ' ' + location;
            let category = 'Kulttuuri', subcategory = 'Kulttuuri';

            // Stand up & komedia ENSIN ennen keikkapaikkalogiikkaa
            if (/stand.?up|standup/.test(t)) {
              category = 'Kulttuuri'; subcategory = 'Komedia';

            // Mentalismi ja taikuus — ennen keikkapaikkalogiikkaa
            } else if (/mentalisti|taikuri|taikuus|illusionisti/.test(t)) {
              category = 'Kulttuuri'; subcategory = 'Kulttuuri';

            // Salibandy F-liiga joukkueet
            } else if (/eräviikingit|nokian.?krp|krp\b|classic\b|westend.?indians|\bindians\b|happee\b|spv\b|ssra\b|oilers\b|cocks\b|dicken\b|salibandy|salibandyliiga|f-liiga/.test(t) && !/ravintola|illallinen/.test(t)) {
              category = 'Urheilu'; subcategory = 'Urheilu';

            // Käsipallo
            } else if (/käsipallo|puolivälierä|välierä.*käsi|käsi.*finaali/.test(t)) {
              category = 'Urheilu'; subcategory = 'Urheilu';

            // Jääkiekko SM-liiga + Mestis - kaikki joukkueet
            } else if (/jääkiekko|sm.?liiga|mestis|hifk|tappara|kärpät|lukko|kalpa|pelicans|jyp\b|saipa|ässät|koovee|tuto.?hockey|roki\b|ketterä\b|ipk\b|jokp\b|keupa\b|kiekko.?vantaa|hermes\b|nokian.?pyry|kiekko.?espoo|hpk\b|kookoo\b|jukurit\b/.test(t) && !/ravintola|illallinen|dinner/.test(t)) {
              category = 'Urheilu'; subcategory = 'Jääkiekko';
            } else if (/\bilves\b/.test(t) && /ottelu|vs\.|hockey|kiekko/.test(t) && !/ravintola|illallinen/.test(t)) {
              category = 'Urheilu'; subcategory = 'Jääkiekko';
            } else if (/\bsport\b/.test(t) && /ottelu|vs\.|kiekko|liiga/.test(t)) {
              category = 'Urheilu'; subcategory = 'Jääkiekko';
              category = 'Urheilu'; subcategory = 'Jääkiekko';

            // Jalkapallo
            } else if (/jalkapallo|veikkausliiga|hjk|futis/.test(t)) {
              category = 'Urheilu'; subcategory = 'Jalkapallo';

            // Koripallo Korisliiga - kaikki joukkueet
            } else if (/koripallo|\bbasket\b|\bkoris\b|helsinki seagulls|tampereen pyrintö|salon vilpas|kataja basket|bisons loimaa|tapiolan honka|korihait|\bkouvot\b|\bkobrat\b|karhu basket|bc nokia|kobra.?basket|lahti basketball/.test(t)) {
              category = 'Urheilu'; subcategory = 'Koripallo';

            // Nyrkkeily
            } else if (/nyrkkeily|boxing|nyrkkeil/.test(t)) {
              category = 'Urheilu'; subcategory = 'Nyrkkeily';

            // Muu urheilu
            } else if (/\bottelu\b|turnaus|kilpailu|maraton|\bjuoksu\b|urheilu/.test(t) && !/teatteri|konsertti|musiik/.test(t)) {
              category = 'Urheilu'; subcategory = 'Urheilu';

            // Musiikki - keikkapaikat automaattisesti Musiikkiin (mutta ei stand up tai urheilu)
            } else if (KEIKKAPAIKAT.test(location) || KEIKKAPAIKAT.test(nameLower)) {
              category = 'Musiikki'; subcategory = 'Musiikki';
              if (/rock|punk/.test(t)) subcategory = 'Rock';
              else if (/metal|heavy/.test(t)) subcategory = 'Heavy';
              else if (/jazz/.test(t)) subcategory = 'Jazz';
              else if (/klassi|sinfoni|orkesteri/.test(t)) subcategory = 'Klassinen';
              else if (/rap\b|hip.?hop/.test(t)) subcategory = 'Rap';
              else if (/elektro|techno|dj\b/.test(t)) subcategory = 'Elektroninen';
              else if (/blues/.test(t)) subcategory = 'Blues';
              else if (/folk|kansanmusiik/.test(t)) subcategory = 'Folk';

            // Musiikki - genret
            } else if (/rock|punk/.test(t)) { category = 'Musiikki'; subcategory = 'Rock';
            } else if (/metal|heavy/.test(t)) { category = 'Musiikki'; subcategory = 'Heavy';
            } else if (/jazz/.test(t)) { category = 'Musiikki'; subcategory = 'Jazz';
            } else if (/klassi|sinfoni|orkesteri|filharmon/.test(t)) { category = 'Musiikki'; subcategory = 'Klassinen';
            } else if (/rap\b|hip.?hop/.test(t)) { category = 'Musiikki'; subcategory = 'Rap';
            } else if (/elektro|techno|dj\b|klubbi/.test(t)) { category = 'Musiikki'; subcategory = 'Elektroninen';
            } else if (/blues/.test(t)) { category = 'Musiikki'; subcategory = 'Blues';
            } else if (/folk|kansanmusiik/.test(t)) { category = 'Musiikki'; subcategory = 'Folk';
            } else if (/pop\b|iskelmä|schlager/.test(t)) { category = 'Musiikki'; subcategory = 'Pop';
            } else if (/konsertti|keikka|musiik|bändi|kuoro|yhtye|artisti/.test(t)) { category = 'Musiikki'; subcategory = 'Musiikki';

            // Kulttuuri
            } else if (/komedia|huumori/.test(t)) { category = 'Kulttuuri'; subcategory = 'Komedia';
            } else if (/teatteri|näytelmä|musikaali/.test(t)) { category = 'Kulttuuri'; subcategory = 'Teatteri';
            } else if (/ooppera|opera/.test(t)) { category = 'Kulttuuri'; subcategory = 'Ooppera';
            } else if (/tanssi|baletti/.test(t)) { category = 'Kulttuuri'; subcategory = 'Tanssi';
            } else if (/sirkus/.test(t)) { category = 'Kulttuuri'; subcategory = 'Sirkus';
            } else if (/näyttely|galleria|museo/.test(t)) { category = 'Kulttuuri'; subcategory = 'Näyttely';
            } else if (/lapset|perhe|family|kids|lasten/.test(t)) { category = 'Lapset'; subcategory = 'Lapset';
            }

            const key = short_name.substring(0, 60) + '_' + date;
            if (!grouped.has(key)) {
              grouped.set(key, {
                title: short_name.substring(0, 255),
                description: 'Tiketti: ' + short_name,
                city: (get('location_city') || 'Helsinki').substring(0, 100),
                venue: get('location_name').substring(0, 255),
                address: '', category, subcategory,
                start_date: date,
                start_time: startdate.includes(' ') ? startdate.split(' ')[1].slice(0,5) : null,
                end_date: null, end_time: null,
                price: get('priceinfo').substring(0, 100),
                ticket_url: get('ticket_affiliate_url').substring(0, 500),
                event_url: get('ticket_affiliate_url').substring(0, 500),
                image_url: '',
                source: 'tiketti',
                source_id: ('tiketti-' + key.replace(/[^a-z0-9]/gi, '-')).substring(0, 100),
                status: 'auto_approved',
              });
            }
          }

          const events = [...grouped.values()];
          console.log('Tapahtumia:', events.length, '| Suodatettu pois:', skipped);
          if (events.length === 0) process.exit(0);

          const URL = process.env.SUPABASE_URL;
          const KEY = process.env.SUPABASE_SERVICE_KEY;

          await fetch(URL + '/rest/v1/events?source=eq.tiketti', {
            method: 'DELETE',
            headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }
          });

          for (let i = 0; i < events.length; i += 50) {
            const r = await fetch(URL + '/rest/v1/events', {
              method: 'POST',
              headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
              body: JSON.stringify(events.slice(i, i+50))
            });
            console.log('Era', Math.floor(i/50)+1, r.ok ? 'ok' : await r.text());
          }
          console.log('Valmis:', events.length, 'tapahtumaa');
          JSEOF
          node --input-type=module < /tmp/tiketti.mjs
